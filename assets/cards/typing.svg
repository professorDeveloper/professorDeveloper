<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 500 100'
    style='background-color: #00000000;'
    width='500px' height='100px'>

    
                    <path id='path0'>
                            <!-- Single line -->
                                <animate id='d0' attributeName='d' begin='0s;d3.end'
                    dur='5000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h500 ; m0,50 h500 ; m0,50 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Time New Roman", monospace' fill='#C8BE25' font-size='25'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            Hello Github
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Single line -->
                                <animate id='d1' attributeName='d' begin='d0.end'
                    dur='5000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h500 ; m0,50 h500 ; m0,50 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Time New Roman", monospace' fill='#C8BE25' font-size='25'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Welcome to my profile
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Single line -->
                                <animate id='d2' attributeName='d' begin='d1.end'
                    dur='5000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h500 ; m0,50 h500 ; m0,50 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Time New Roman", monospace' fill='#C8BE25' font-size='25'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            kotlin java dart
        </textPath>
    </text>
        <path id='path3'>
                            <!-- Single line -->
                                <animate id='d3' attributeName='d' begin='d2.end'
                    dur='5000ms' fill='remove'
                    values='m0,50 h0 ; m0,50 h500 ; m0,50 h500 ; m0,50 h0' keyTimes='0;0.8;0.8;1' />
                    </path>
    <text font-family='"Time New Roman", monospace' fill='#C8BE25' font-size='25'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path3'>
            Android Flutter KMM
        </textPath>
    </text>
</svg>
